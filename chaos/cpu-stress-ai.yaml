apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: ai-cpu-stress
  namespace: chaos-mesh
spec:
  mode: one
  selector:
    namespaces:
      - ai-inference
    labelSelectors:
      app: ollama
  stressors:
    cpu:
      workers: 2
      load: 90              # 90% CPU stress
  duration: "180s"

# CPU stress on the AI inference workload (trial variant of README §4.5)
# The README's original targets a GPU node (role: gpu) — the trial has no GPU
# nodes, so the stress hits the Ollama pod instead: inference degrades,
# queue depth grows, and KEDA should scale to compensate — the chaos
# experiment doubles as an autoscaling validation.
apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: ai-cpu-stress
  namespace: chaos-mesh
spec:
  mode: one
  selector:
    namespaces:
      - ai-inference
    labelSelectors:
      app: ollama
  stressors:
    cpu:
      workers: 2
      load: 90              # 90% CPU stress
  duration: "180s"

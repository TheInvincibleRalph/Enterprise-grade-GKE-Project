# ⚠️ SUPERSEDED — ingress-nginx Helm values (Phase 1.3, original)
#
# The community ingress-nginx controller was retired in March 2026 (no
# releases, no security fixes). It has been replaced by Envoy Gateway +
# Coraza WAF — see kubernetes/gateway/ and scripts/install-envoy-gateway.sh.
#
# Kept here as the "before" state for the migration course milestone.
# This file is NOT applied by any current script.
#
# ---------------------------------------------------------------------------
# Original content:
# ModSecurity + OWASP Core Rule Set (CRS) for WAF protection.
# Coraza is the ModSecurity-compatible engine used by newer ingress-nginx builds.

controller:
  ingressClassResource:
    name: nginx
    enabled: true
    default: true

  service:
    type: LoadBalancer
    annotations:
      cloud.google.com/load-balancer-type: External

  config:
    # WAF — block OWASP Top 10 attack patterns
    enable-modsecurity: "true"
    enable-owasp-modsecurity-crs: "true"
    modsecurity-snippet: |
      SecRuleEngine On

  metrics:
    enabled: true
    serviceMonitor:
      enabled: false # Enable when Prometheus is installed in Phase 2

  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "10254"

  # Schedule on application nodes (not system pool taint)
  nodeSelector:
    role: application

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  replicaCount: 2

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: ingress-nginx
            topologyKey: topology.kubernetes.io/zone

defaultBackend:
  enabled: true

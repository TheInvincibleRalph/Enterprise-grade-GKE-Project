apiVersion: apps/v1
kind: Deployment
metadata:
  name: queue-worker
  namespace: ai-inference
  labels:
    app: queue-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: queue-worker
  template:
    metadata:
      labels:
        app: queue-worker
    spec:
      containers:
        - name: worker
          image: python:3.12-slim
          command: ["/bin/bash", "-c"]
          args:
            - |
              pip install redis &&
              cat > /worker.py << 'PYEOF'
              import redis, json, time, urllib.request
              r = redis.Redis(host='redis.ai-inference.svc.cluster.local', port=6379,
                              socket_timeout=10, socket_connect_timeout=5)
              while True:
                  item = None
                  answered = False
                  try:
                      # Move the job to the processing list atomically: KEDA scales on
                      # that list, so a job being worked keeps the deployment alive.
                      item = r.brpoplpush('inference_queue', 'inference_processing', timeout=5)
                      if not item:
                          continue
                      task = json.loads(item)
                      resp = None
                      for attempt in range(20):
                          try:
                              req = urllib.request.Request(
                                  'http://ollama:11434/api/generate',
                                  data=json.dumps({'model': 'llama3.2:3b', 'prompt': task['prompt'], 'stream': False}).encode(),
                                  headers={'Content-Type': 'application/json'})
                              resp = json.loads(urllib.request.urlopen(req, timeout=300).read())
                              break
                          except Exception as e:
                              # Ollama can be cold (pod starting, model loading, node churn).
                              # The job stays in the processing list during the wait, which
                              # keeps the deployment alive, so this retry window is the
                              # cold start itself.
                              if attempt == 0:
                                  print("model not ready yet, waiting (job stays in the processing list)", flush=True)
                              if attempt == 19:
                                  raise RuntimeError(f"ollama call failed after retries: {e}")
                              time.sleep(min(30, 3 * (attempt + 1)))
                      r.set(f"result:{task['id']}",
                            json.dumps({'id': task['id'], 'response': resp.get('response', '')}))
                      answered = True
                      r.lrem('inference_processing', 0, item)
                  except Exception as e:
                      print(f"worker error: {e}", flush=True)
                      if item is not None and not answered:
                          # the job was popped but never answered: put it back
                          try:
                              r.lrem('inference_processing', 0, item)
                              r.lpush('inference_queue', item)
                          except Exception:
                              pass
                      time.sleep(2)
              PYEOF
              python /worker.py
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"

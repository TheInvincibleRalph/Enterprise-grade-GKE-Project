# Phase 3.4/3.5 — KEDA ScaledObject: queue-driven autoscaling (CPU variant)
#
# The GPU version of this project scales on DCGM GPU utilization; the trial
# has no GPUs, so the scale source is the Redis inference queue length —
# KEDA is metric-driven, not GPU-driven. Behavior:
#   - queue length > 0 (activationListLength)  -> ollama scales UP to 3
#   - queue length >= 5 (listLength)           -> full target (1 replica each)
#   - queue empty for cooldownPeriod           -> scales to 0 (minReplicaCount)
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ollama-scaler
  namespace: ai-inference
spec:
  scaleTargetRef:
    name: ollama
  minReplicaCount: 0
  maxReplicaCount: 3
  cooldownPeriod: 60
  pollingInterval: 10
  triggers:
    - type: redis
      metadata:
        address: redis.ai-inference.svc.cluster.local:6379
        listName: inference_queue
        listLength: "5"
        activationListLength: "0"

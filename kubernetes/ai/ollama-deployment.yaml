# Ollama inference server — CPU variant (Phase 3.2, trial cluster)
#
# The README's §3.2 manifest is the GPU version (nodeSelector nvidia-l4,
# 4 CPU / 16 Gi / 1 GPU requests) — unschedulable on the free trial, which
# has no GPU nodes and 1-vCPU/4 GB machines. This variant:
#   - drops the GPU nodeSelector entirely
#   - sizes to the nodes: 500m/1Gi requests, 1 CPU / 2 Gi limits
#     (a 4 Gi limit on a 4 GB node = overcommit; the 2 GB llama3.2:3b model
#     load OOM-killed the container — use llama3.2:1b (1.3 GB) on this sizing)
#   - OLLAMA_NUM_PARALLEL=1 (4 parallel jobs on 1 vCPU = thrash)
# Note: pause the boutique loadgenerator during the AI phase (nodes are ~96%
# memory-requested; the model load needs the headroom).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ai-inference
  labels:
    app: ollama
    app.kubernetes.io/part-of: devops-portfolio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
              name: api
          readinessProbe:
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 30
            periodSeconds: 10
          env:
            - name: OLLAMA_KEEP_ALIVE
              value: "24h"
            - name: OLLAMA_NUM_PARALLEL
              value: "1"
          resources:
            requests:
              cpu: 100m    # 1-vCPU nodes are CPU-saturated; 500m request = half a node = "Insufficient cpu"
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 4Gi
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
      volumes:
        - name: models
          emptyDir:
            sizeLimit: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: ai-inference
  labels:
    app: ollama
spec:
  selector:
    app: ollama
  ports:
    - port: 11434
      targetPort: 11434
  type: ClusterIP

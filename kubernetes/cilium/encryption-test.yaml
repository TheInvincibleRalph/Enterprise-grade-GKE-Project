apiVersion: v1
kind: Namespace
metadata:
  name: test-a
---
apiVersion: v1
kind: Namespace
metadata:
  name: test-b
---

apiVersion: v1
kind: Pod
metadata:
  name: netshoot-a
  namespace: test-a
  labels:
    app: netshoot
spec:
  nodeSelector:
    role: application
  containers:
    - name: netshoot
      image: nicolaka/netshoot:latest
      command: ["sleep", "3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: netshoot-b
  namespace: test-b
  labels:
    app: netshoot
spec:
  nodeSelector:
    role: application
  containers:
    - name: netshoot
      image: nicolaka/netshoot:latest
      command: ["sleep", "3600"]
